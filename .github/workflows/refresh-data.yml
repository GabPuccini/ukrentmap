# Weekly data refresh.
#
# Every Thursday morning: download the latest ONS rents and OS Code-Point
# Open. If either has a new edition, rebuild public/data/, check the site
# still builds, commit the new data to main and start the Pages deploy.
# If nothing new was published, it stops after the download.
#
# ONS publishes the rent index on a Wednesday each month, so Thursday picks
# it up within a day. If anything fails (a changed ONS file, a download
# error, the safety checks in build_data.py), nothing is committed, the live
# map keeps its current data, and GitHub emails you about the failed run.
#
# Run it by hand: Actions -> Refresh data -> Run workflow. Tick "force" to
# rebuild and publish even when nothing new has been released.
name: Refresh data

on:
  schedule:
    - cron: "17 5 * * 4" # Thursdays 05:17 UTC
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild and publish even if no new data was released
        type: boolean
        default: false

permissions:
  contents: write # commit the refreshed data
  actions: write # start the Pages deploy afterwards

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    # Pinned: tippecanoe is packaged for Ubuntu 24.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install data tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tippecanoe
          pip install -r scripts/requirements.txt

      - name: Download the latest sources
        run: python scripts/fetch_data.py

      - name: Anything new?
        id: check
        run: python scripts/data_changed.py

      - name: Rebuild map data
        if: steps.check.outputs.changed == 'true' || inputs.force
        run: python scripts/build_data.py

      - uses: actions/setup-node@v7
        if: steps.check.outputs.changed == 'true' || inputs.force
        with:
          node-version: 22
          package-manager-cache: false

      - name: Check the site still builds
        if: steps.check.outputs.changed == 'true' || inputs.force
        run: |
          npm ci
          npm run typecheck
          npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /ukrentmap
          NEXT_TELEMETRY_DISABLED: 1

      - name: Commit the new data
        id: commit
        if: steps.check.outputs.changed == 'true' || inputs.force
        run: |
          git add public/data
          if git diff --cached --quiet; then
            echo "Nothing changed in public/data."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          month=$(python -c "import json; print(json.load(open('public/data/meta.json'))['rentMonth'])")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh data: rents to ${month} (${SUMMARY})"
          git push origin HEAD:main
          echo "pushed=true" >> "$GITHUB_OUTPUT"
        env:
          SUMMARY: ${{ steps.check.outputs.summary || 'forced rebuild' }}

      # A push made with this workflow's token doesn't start other workflows,
      # so start the deploy explicitly.
      - name: Publish
        if: steps.commit.outputs.pushed == 'true'
        run: gh workflow run pages.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
